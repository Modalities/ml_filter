model:
  num_tasks: ${data.num_tasks}  # Number of prediction tasks
  num_targets_per_task: ${data.num_targets_per_task}  # Number of classes per output
  regressor_hidden_dim: 100
  init_regression_weights: false

data: 
  train_file_path: outputs/embeddings_output
  train_file_split: train
  test_file_path: outputs/embeddings_output
  test_file_split: train
  val_file_path: outputs/embeddings_output
  embeddings_dataset: embeddings  # Name of the HDF5 dataset containing embedding vectors
  labels_dataset: scores  # Name of the HDF5 dataset containing labels
  num_tasks: 1
  num_targets_per_task: [6]
  task_names: ["edu"]
  num_processes: 2

training:
  batch_size: 12
  eval_batch_size: 12
  epochs: 20
  use_bf16: true
  weight_decay: 0.01 # 0.01
  eval_strategy: epoch
  save_strategy: epoch
  logging_steps: 1
  seed: 42
  greater_is_better: true  # Spearman correlation is maximised
  metric_for_best_model: output/eval_test_edu/spearman_corr
  loss_reduction: mean  # Options: mean, sum, none
  learning_rate: 5e-04 # 5e-04
  logging_dir_path: output/regression_head_logs
  output_dir_path: ${training.logging_dir_path}
  dataloader_num_workers: 2
  load_best_model_at_end: false
